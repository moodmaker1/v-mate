<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v-mate 설정</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 20px;
      color: #667eea;
      margin-bottom: 15px;
    }
    .info {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    .api-section {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .api-section h2 {
      font-size: 14px;
      margin-bottom: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <h1>💡 v-mate</h1>
  <div class="info">
    <p>대학생을 위한 AI 학습 도우미</p>
    <p style="margin-top: 10px; font-size: 12px;">
      웹페이지에서 텍스트를 드래그하면<br>
      GPT가 쉽게 설명해드립니다.
    </p>
  </div>
  
  <div class="api-section">
    <h2>API 키 설정</h2>
    <input type="password" id="apiKey" placeholder="OpenAI API 키를 입력하세요">
    <button id="saveBtn">저장</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
