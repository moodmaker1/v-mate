<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v-mate 설정</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 헤더 -->
    <div class="popup-header">
      <h1>💡 v-mate</h1>
      <p class="subtitle">AI 학습 도우미</p>
    </div>

    <!-- 현재 모드 표시 -->
    <div class="current-mode">
      <span class="mode-label">현재 모드:</span>
      <span class="mode-value" id="currentModeDisplay">실시간 설명 💡</span>
    </div>

    <!-- 모드 선택 -->
    <div class="mode-section">
      <h2>기능 선택</h2>
      
      <div class="mode-option" id="mode-realtime">
        <div class="mode-radio">
          <input type="radio" name="mode" id="radio-realtime" checked>
          <label for="radio-realtime"></label>
        </div>
        <div class="mode-content">
          <div class="mode-icon">💡</div>
          <div class="mode-info">
            <h3>실시간 설명</h3>
            <p>텍스트 드래그하면 바로 설명</p>
          </div>
        </div>
      </div>

      <div class="mode-option" id="mode-quiz">
        <div class="mode-radio">
          <input type="radio" name="mode" id="radio-quiz">
          <label for="radio-quiz"></label>
        </div>
        <div class="mode-content">
          <div class="mode-icon">❓</div>
          <div class="mode-info">
            <h3>퀴즈 모드</h3>
            <p>텍스트 드래그하면 퀴즈 생성</p>
          </div>
        </div>
      </div>
    </div>

    <!-- API 키 설정 -->
    <div class="api-section">
      <h2>⚙️ API 키 설정</h2>
      
      <label class="api-label">OpenAI API 키</label>
      <input 
        type="password" 
        id="apiKey" 
        placeholder="OpenAI API 키를 입력하세요"
        autocomplete="off"
      >
      <p class="api-help">
        <a href="https://platform.openai.com/api-keys" target="_blank">
          발급받기 →
        </a>
      </p>
      
      <label class="api-label">ElevenLabs API 키 (음성 TTS)</label>
      <input 
        type="password" 
        id="elevenlabsApiKey" 
        placeholder="ElevenLabs API 키를 입력하세요"
        autocomplete="off"
      >
      <p class="api-help">
        <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank">
          발급받기 →
        </a>
      </p>
      
      <button id="saveBtn" class="save-btn">저장</button>
    </div>

    <!-- 푸터 -->
    <div class="popup-footer">
      <p>v-mate v2.0 | Made with ❤️</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
