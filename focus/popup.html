<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Guard - 집중 관리</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="focus-popup-container">
    <!-- 헤더 -->
    <div class="focus-header">
      <h1>🎯 Focus Guard</h1>
      <p class="subtitle">집중 관리 시스템</p>
    </div>

    <!-- 현재 목표 목록 -->
    <div class="focus-goals-section">
      <div class="section-header">
        <h2>오늘의 목표</h2>
        <button id="addGoalBtn" class="add-goal-btn">+ 추가</button>
      </div>
      
      <div id="goalsList" class="goals-list">
        <!-- 목표들이 여기에 동적으로 추가됨 -->
      </div>
      
      <div id="emptyState" class="empty-state">
        <p>목표를 추가해주세요</p>
      </div>
    </div>

    <!-- 통계 -->
    <div id="statsSection" class="focus-stats-section" style="display: none;">
      <h2>📊 오늘의 통계</h2>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">총 공부 시간</div>
          <div class="stat-value" id="totalStudyTime">0분</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">딴짓 시간</div>
          <div class="stat-value" id="totalDistractionTime">0분</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">집중도</div>
          <div class="stat-value" id="focusScore">0%</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 목표 추가/수정 모달 -->
  <div id="goalModal" class="goal-modal" style="display: none;">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">목표 추가</h3>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>과목/목표</label>
          <input type="text" id="goalSubject" placeholder="예: 데이터베이스, 알고리즘" maxlength="50">
        </div>
        <div class="form-group">
          <label>목표 시간</label>
          <div class="time-input-group">
            <input type="number" id="goalHours" min="0" max="12" value="1" placeholder="시간">
            <span>시간</span>
            <input type="number" id="goalMinutes" min="0" max="59" value="0" placeholder="분">
            <span>분</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel">취소</button>
        <button class="btn-save">저장</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
